name: CI

# Every suite that needs no `codex` binary and calls no model, on both OSes and on the Node floor
# package.json declares: the driver has a macOS-only call (the managed preferences plist), Linux is
# otherwise unmeasured, and the floor was a claim nothing tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          # evals/package.test.mjs compares the tree's version against a v* tag on HEAD, and a shallow
          # checkout carries no tags at all.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Parsed before anything runs: a syntax error under the older engine is the one failure that must
      # not arrive disguised as a broken test. The list is the directories, so a new script is covered
      # the day it is added.
      - name: Parse every shipped script under this engine
        run: for f in skills/codex-delegate/scripts/*.mjs evals/*.mjs evals/lib/*.mjs; do node --check "$f"; done
      # No install step: the driver, the suites and the fixture import node: builtins only.
      # The suites that need the real `codex` or `claude` are not run here: without the binary or the
      # opt-in variable each skips, says so, and exits 0. They stay LOCAL pre-release steps (RELEASING.md):
      # they need an authenticated home and they spend real money.
      - name: Suites
        # $TMPDIR is the whole grant at --level read, and a stock Linux shell does not set it: without it
        # every read-level case is a usage error before anything is spawned. The runner context is only
        # available at step level, which is why this sits here and not on the job.
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test

